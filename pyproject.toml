[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat -- Applied AI Engineer take-home"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber==0.11.9",
    "pypdf==5.9.0",
    "reportlab==4.4.10",
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "Pillow==12.1.1",
    "rapidfuzz==3.14.5",
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "anthropic==0.120.0",
    "groq==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
